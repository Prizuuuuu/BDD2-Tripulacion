# Avance 4 · Grupo 5 · Tripulación: fuentes (PostgreSQL + Neo4j), Data Mart (MySQL 8.0) y Metabase
services:
  staging_pg:            # Staging central de las Unidades 1 y 2 (PostgreSQL 16)
    image: postgres:16
    container_name: a4_staging_pg
    environment:
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: tripulacion
    ports: ["5440:5432"]
    volumes:
      - ../avance2/staging/tripulacion_staging.sql:/docker-entrypoint-initdb.d/01_staging.sql:ro
      - a4_pg:/var/lib/postgresql/data

  neo4j:                 # Grafo de la Unidad 3 (mismos scripts que se cargaron en AuraDB)
    image: neo4j:5.26-community
    container_name: a4_neo4j
    environment:
      NEO4J_AUTH: neo4j/tripulacion2026
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - "../avance 3:/cypher:ro"
      - ./neo4j:/scripts:ro
      - a4_neo4j:/data

  mysql_dm:              # Data Mart (motor opuesto a la Unidad 1: MySQL 8.0)
    image: mysql:8.0
    container_name: a4_mysql_dm
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
    ports: ["3307:3306"]
    volumes:
      - ./sql/01_dm_tripulacion_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./sql/03_vistas_metabase.sql:/docker-entrypoint-initdb.d/02_vistas.sql:ro
      - a4_mysql:/var/lib/mysql

  metabase:              # Visualización: http://localhost:3000
    image: metabase/metabase:latest
    container_name: a4_metabase
    ports: ["3000:3000"]
    depends_on: [mysql_dm]
    volumes:
      - a4_metabase:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  a4_pg:
  a4_neo4j:
  a4_mysql:
  a4_metabase:
